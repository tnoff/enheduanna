[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enheduanna"
description = "Enheduanna Note Tool"
dynamic = ["version"]
authors = [
    {name = "Tyler D. North", email = "me@tyler-north.com"}
]
dependencies = [
    "click==8.5.0",
    "pathlib==1.0.1",
    "pyaml_env==1.2.2",
    # TODO: python 3.15 image build (Dockerfile) fails on aarch64 because
    # pydantic-core has no cp315 wheel yet (renovate PR #204). Once a pydantic
    # bump pulls in a pydantic-core with 3.15 wheels, retry the python 3.15 bump.
    "pydantic==2.14.1",
]

[project.optional-dependencies]
test = [
    "bandit==1.9.4",
    "pylint==4.1.3",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-freezegun==0.4.2",
    # Currently required for pytest-freezegun, can remove once they have that fixed
    "setuptools==84.0.0",
    "tox==4.65.4",
]

[project.scripts]
enheduanna = "enheduanna.cli:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
exclude = ["tests*"]
