# Backstage catalog descriptor. Discovered automatically -- the portal's GitHub
# provider reads catalog-info.yaml from the default branch of every repo the
# tnoff-backstage App can see, so adding this file is the whole of onboarding.
#
# github.com/project-slug is DERIVED by the portal's
# AnnotateScmSlugEntityProcessor from the location this file was fetched from.
# techdocs-ref is set below now that mkdocs.yml + docs/ exist; the
# kubernetes / grafana annotations still assert targets that don't exist yet,
# so they stay out until those plugins are wired up.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: enheduanna
  description: >-
    Command-line tool for keeping Markdown work notes: files entries into dated
    sub-folders, collates them into summaries, and promotes recurring notes into
    standalone documentation. Pip-installable, run locally.
  annotations:
    backstage.io/techdocs-ref: dir:.
spec:
  type: library
  owner: group:default/admin
  lifecycle: production
  dependsOn:
    - component:default/github-workflows
