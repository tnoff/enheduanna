name: Scheduled

# Replaces the GitLab weekly pipeline schedule, deactivated in terraform!258.
# Same cron terraform derived for it, so the cadence is unchanged.

on:
  schedule:
    - cron: '5 21 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    uses: tnoff/github-workflows/.github/workflows/renovate.yml@f064a9ce541cc052d9a2c9036bde578aede7b7d1
    secrets:
      renovate_token: ${{ secrets.RENOVATE_TOKEN }}

  branch-cleanup:
    name: Branch cleanup
    permissions:
      contents: write
      pull-requests: read
    uses: tnoff/github-workflows/.github/workflows/branch-cleanup.yml@f064a9ce541cc052d9a2c9036bde578aede7b7d1
    with:
      age_days: 30
      dry_run: false
