name: Scheduled

# Replaces the GitLab weekly pipeline schedule, deactivated in terraform!258.
# Same cron terraform derived for it, so the cadence is unchanged.

on:
  schedule:
    - cron: '5 21 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    uses: tnoff/github-workflows/.github/workflows/renovate.yml@7d6ac98382ec555ef3520ae1c2f07183c35e5127
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  branch-cleanup:
    name: Branch cleanup
    permissions:
      contents: write
      pull-requests: read
    uses: tnoff/github-workflows/.github/workflows/branch-cleanup.yml@7d6ac98382ec555ef3520ae1c2f07183c35e5127
    with:
      age_days: 30
      dry_run: false
